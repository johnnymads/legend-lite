<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DataCube</title>
<!-- ONE PAGE NOW (the user, 2026-09-30): the planner is a setting of index.html, not a page of
     its own. This address keeps working: it goes there, with its settings. -->
<script>
  const url = new URL(location.href);
  url.pathname = url.pathname.replace(/[^/]*$/, 'index.html');
  url.searchParams.set('planner', 'engine');
  // this address ran the engine's own data on the engine
  if (!url.searchParams.has('data')) url.searchParams.set('data', 'engine');
  location.replace(url.href);
</script>
</head>
<body><p>Moved: <a href="index.html?planner=engine">index.html?planner=engine</a>.</p></body>
</html>
