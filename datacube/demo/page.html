<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataCube: a page of cubes</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="../src/theme.css">
<link rel="stylesheet" href="../src/grid/grid.css">
<link rel="stylesheet" href="../src/app.css">
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 12px/16px Roboto, ui-sans-serif, system-ui, sans-serif;
    background: #fff;
    color: #000;
  }
  /* THE PAGE: where the tiles sit, and where their windows float (the cubes' windowHost), so a
     dialog opened from a small tile is not squeezed into it. */
  #page {
    position: relative;
    height: 100vh;
    box-sizing: border-box;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 8px;
  }
  .tile {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border: 1px solid #e5e5e5;
  }
  .tile-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2px 6px;
    background: #fafafa;
    border-bottom: 1px solid #e5e5e5;
  }
  .tile-body { flex: 1 1 auto; min-height: 0; display: flex; }
  .tile-body > .dc-app { flex: 1 1 auto; min-width: 0; }
  #status { position: fixed; bottom: 2px; right: 8px; opacity: .7; }
</style>
</head>
<body>
  <div id="page"></div>
  <span id="status">loading&hellip;</span>
  <script type="module" src="./bundle-page.js"></script>
</body>
</html>
